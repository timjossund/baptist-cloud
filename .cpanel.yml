---
# Baptist Cloud — cPanel Git deployment
# Docs: https://docs.cpanel.net/knowledge-base/web-services/guide-to-git-deployment/
#
# Layout:
#   ~/baptist.cloud/              Laravel application (APPPATH)
#   ~/baptist.cloud/public_html/  production web root (DEPLOYPATH)
#
# Before first deploy, create on the server:
#   ~/baptist.cloud/.env       (from .env.example)
#   ~/baptist.cloud/auth.json  (Laravel Spark credentials)
#
deployment:
  tasks:
    - export APPPATH=$HOME/baptist.cloud
    - export DEPLOYPATH=$HOME/baptist.cloud/public_html
    - /bin/mkdir -p $APPPATH $DEPLOYPATH
    - /bin/cp -R app $APPPATH
    - /bin/cp -R bootstrap $APPPATH
    - /bin/cp -R config $APPPATH
    - /bin/cp -R database $APPPATH
    - /bin/cp -R lang $APPPATH
    - /bin/cp -R resources $APPPATH
    - /bin/cp -R routes $APPPATH
    - /bin/cp artisan $APPPATH
    - /bin/cp composer.json $APPPATH
    - /bin/cp composer.lock $APPPATH
    - /bin/cp package.json $APPPATH
    - /bin/cp vite.config.js $APPPATH
    - /bin/cp tailwind.config.js $APPPATH
    - /bin/cp postcss.config.js $APPPATH
    - /bin/mkdir -p $APPPATH/storage/framework/cache/data $APPPATH/storage/framework/sessions $APPPATH/storage/framework/views $APPPATH/storage/logs $APPPATH/storage/app/public
    - /bin/chmod -R ug+rwx $APPPATH/storage $APPPATH/bootstrap/cache
    - cd $APPPATH
    - /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - /usr/local/bin/npm install
    - /usr/local/bin/npm run build
    - /usr/local/bin/php artisan storage:link --force
    - /bin/cp $APPPATH/public/index.php $DEPLOYPATH
    - /bin/cp $APPPATH/public/.htaccess $DEPLOYPATH
    - /bin/cp $APPPATH/public/robots.txt $DEPLOYPATH
    - /bin/cp $APPPATH/public/favicon.ico $DEPLOYPATH
    - /bin/cp $APPPATH/public/logo.svg $DEPLOYPATH
    - /bin/cp -R $APPPATH/public/build $DEPLOYPATH
    - /bin/cp -R $APPPATH/public/storage $DEPLOYPATH
    - /usr/local/bin/php artisan migrate --force
    - /usr/local/bin/php artisan optimize
